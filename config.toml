[plugin]
enabled = false
config_version = "2.7.1"

[admin]
admins = []
allow_group_owner = true
owner_allowed_commands = []
deny_response = "silent"
allow_member_self_modify = false

[identity]
bot_nickname = "麦麦"
auto_detect = true
bot_qq = ""
role_cache_ttl_seconds = 600
bot_role_refresh_seconds = 300
sender_role_refresh_seconds = 120

[identity.override_roles]

[auto_moderate]
enabled = true
enabled_groups = []

[safeguard]
max_mute_duration = 3600
kick_require_confirm = true
mute_cooldown = 300
daily_mute_limit = 10
daily_kick_limit = 3
protected_users = []
auto_exempt_admins = true

[safeguard.exempt_users]

[warning]
enabled = true
spam_warn_threshold = 3
spam_warn_window = 600
abuse_warn_threshold = 1
abuse_warn_window = 3600
ad_warn_threshold = 1
ad_warn_window = 1800

[escalation]
enabled = true
escalation_steps = []

[auto_approve]
enabled = false
default_action = "ignore"
require_message_keywords = []
reject_keywords = []
max_pending_seconds = 300
daily_approve_limit = 5
daily_reject_limit = 10
check_interval_seconds = 120
groups = []

[logging]
max_log_entries = 2000
default_log_lines = 10
verbose_logging = false

[prompts]
auto_moderate_system = "【群管理】你是本群 Bot，身份：{bot_role}；可用操作：{available_actions}。\n处理规则：根据当前证据与严重程度选择提醒、撤回、禁言或踢出；正常聊天不要误判。优质分享可设精华；证据不足时先查询或观察。\n执行要求：目标身份或 QQ 不确定时先调用 group_get_member 确认；撤回/精华需先获取 message_id；必须真实调用对应 group_* 工具，未调用不得声称已执行；执行后根据成功或失败结果简洁回复。\n正常聊天优先，发现违规再处理。"
planner_moderate_system = "# 群管理准则\nBot 身份：{bot_role}；可用操作：{available_actions}。\n处理规则：按当前证据和严重程度自主选择合适操作；优质分享可设精华；不确定先查证。\n执行要求：遵循动态身份权限说明；目标不确定先查询；需执行时本轮直接调用 group_* 工具，未调用不得声称已执行。"
command_denied_message = "你没有权限执行此操作。"
