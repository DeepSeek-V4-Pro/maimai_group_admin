[plugin]
enabled = false
config_version = "2.4.0"

[admin]
admins = []
allow_group_owner = true
owner_allowed_commands = []
deny_response = "silent"

[identity]
bot_nickname = "麦麦"
auto_detect = true
bot_qq = ""

[identity.override_roles]

[auto_moderate]
enabled = true
enabled_groups = []

[safeguard]
max_mute_duration = 3600
kick_require_confirm = true
mute_cooldown = 300
daily_mute_limit = 10
daily_kick_limit = 3
protected_users = []
auto_exempt_admins = true

[safeguard.exempt_users]

[warning]
enabled = true
spam_warn_threshold = 3
spam_warn_window = 600
abuse_warn_threshold = 1
abuse_warn_window = 3600
ad_warn_threshold = 1
ad_warn_window = 1800

[escalation]
enabled = true
escalation_steps = []

[auto_approve]
enabled = false
default_action = "ignore"
require_message_keywords = []
reject_keywords = []
max_pending_seconds = 300
daily_approve_limit = 5
daily_reject_limit = 10
check_interval_seconds = 120
groups = []

[logging]
max_log_entries = 2000
default_log_lines = 10
verbose_logging = false

[prompts]
auto_moderate_system = "【群管理参考 — 保持人设，自然融入】\n\n身份：{bot_role}  可用操作：{available_actions}\n\n发现违规时自然处理，不要解释操作：\n  广告/诈骗 → 撤回 + 禁言10-30分钟\n  连续刷屏 → 提醒一句，仍继续再禁言5-10分钟\n  辱骂/人身攻击 → 撤回 + 禁言1-6小时，再犯踢出\n  色情/违法 → 撤回 + 踢出\n  高质量分享 → 设精华表达赞赏\n  不确定 → 先观察，别着急动手\n\n操作前先用 group_get_member 确认目标身份；撤回/精华需先回复目标消息获取 message_id\n\n执行规则（必须遵守）：\n  - 所有管理操作必须真实调用对应的 group_* 工具完成，工具已直接可用，无需搜索\n  - 禁止只用文字宣称\"已禁言/已撤回/已踢出\"等结果；没有真实调用工具前，不要声称操作已完成\n  - 不要说\"已将xxx禁言\"这类话，执行后保持人设自然回复即可\n\n节奏：正常聊天，发现违规再处理。"
planner_moderate_system = "# 群管理准则\n\n你在此群身份：{bot_role}。可用操作：{available_actions}\n\n违规处理（自然执行，不要复述规则）：\n  广告/诈骗 → 撤回 + 禁言10-30分钟\n  连续刷屏 → 警告 → 仍继续则禁言5-10分钟\n  辱骂/人身攻击 → 撤回 + 禁言1-6小时，再犯踢出\n  色情/违法 → 撤回 + 踢出（管理员先征求群主同意）\n  高质量分享 → 设精华\n\n规则：\n- 操作前先调 group_get_member 确认身份\n- 禁言不超1小时，踢人前确认\n- 不确定则先观察\n- 需要执行管理操作时，必须在本轮直接调用对应的 group_* 工具，不要只在分析里宣布\"我要禁言/撤回/踢出\"却不调用工具\n- 不要声称某个操作已经完成，除非你确实调用了对应工具并看到成功结果\n\n以上融入决策，不要复述。"
command_denied_message = "你没有权限执行此操作。"
