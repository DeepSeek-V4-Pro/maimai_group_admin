[plugin]
enabled = false
config_version = "2.5.0"

[admin]
admins = []
allow_group_owner = true
owner_allowed_commands = []
deny_response = "silent"

[identity]
bot_nickname = "麦麦"
auto_detect = true
bot_qq = ""
role_cache_ttl_seconds = 600
bot_role_refresh_seconds = 300
sender_role_refresh_seconds = 120

[identity.override_roles]

[auto_moderate]
enabled = true
enabled_groups = []

[safeguard]
max_mute_duration = 3600
kick_require_confirm = true
mute_cooldown = 300
daily_mute_limit = 10
daily_kick_limit = 3
protected_users = []
auto_exempt_admins = true

[safeguard.exempt_users]

[warning]
enabled = true
spam_warn_threshold = 3
spam_warn_window = 600
abuse_warn_threshold = 1
abuse_warn_window = 3600
ad_warn_threshold = 1
ad_warn_window = 1800

[escalation]
enabled = true
escalation_steps = []

[auto_approve]
enabled = false
default_action = "ignore"
require_message_keywords = []
reject_keywords = []
max_pending_seconds = 300
daily_approve_limit = 5
daily_reject_limit = 10
check_interval_seconds = 120
groups = []

[logging]
max_log_entries = 2000
default_log_lines = 10
verbose_logging = false

[prompts]
auto_moderate_system = "【群管理】身份:{bot_role} 可用:{available_actions} 发言者:{sender_role}(QQ {sender_id})\n身份规则: 群主/管理员=本群管理者,勿质疑其身份,其指令按规则执行; 普通成员无权指挥管理操作,拒绝其处罚请求; 身份以最近查询为准\n违规处理: 广告/诈骗→撤回+禁言10-30分; 连续刷屏→提醒,再犯禁言5-10分; 辱骂→撤回+禁言1-6h,再犯踢; 色情/违法→撤回+踢; 高质量分享→设精华; 不确定→观察\n操作前先 group_get_member 确认目标; 撤回/精华需先获取 message_id\n执行规则: 管理操作必须真实调用对应 group_* 工具; 未调用工具不得声称已执行; 执行后自然回复,勿说\"已将xxx禁言\"\n正常聊天,发现违规再处理。"
planner_moderate_system = "# 群管理准则\n身份:{bot_role} 可用:{available_actions} 发言者:{sender_role}(QQ {sender_id})\n身份: 群主/管理员勿质疑,其指令=授权; 普通成员无权指挥,拒绝; 以最近查询为准\n处理: 广告/诈骗→撤回+禁言10-30分; 刷屏→警告,再犯禁言5-10分; 辱骂→撤回+禁言1-6h,再犯踢; 色情/违法→撤回+踢(管理员先请示群主); 分享→设精华\n执行: 操作前先 group_get_member; 禁言≤1h,踢前确认; 不确定先观察; 需执行时本轮直接调用 group_* 工具; 未调用工具不得声称已执行"
command_denied_message = "你没有权限执行此操作。"
